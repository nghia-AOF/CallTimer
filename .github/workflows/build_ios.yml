name: Build CallTimer iOS App (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS App (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project CallTimerApp.xcodeproj \
                     -scheme CallTimer \
                     -sdk iphoneos \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO \
                     build

      - name: Package .ipa File
        run: |
          APP=build/Build/Products/Release-iphoneos/CallTimer.app
          echo "Embedded extensions:" && ls "$APP/PlugIns"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CallTimer.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallTimer-iOS-Installer
          path: CallTimer.ipa

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: CallTimer build ${{ github.run_number }}
          body: "Tải file CallTimer.ipa bên dưới và cài bằng Sideloadly (xem BUILD_GUIDE.md)."
          files: CallTimer.ipa
