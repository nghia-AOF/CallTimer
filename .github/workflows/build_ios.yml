name: Build CallTimer iOS App (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: Build iOS App (.app)
        run: |
          xcodebuild -project CallTimerApp.xcodeproj \
                     -scheme CallTimer \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package .ipa File
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CallTimer.app Payload/
          zip -r CallTimer.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallTimer-iOS-Installer
          path: CallTimer.ipa
